# Optional FREE ingress only. This service stores no local database and attaches no disk.
services:
  - type: web
    name: link-workspace-public
    runtime: node
    plan: free
    buildCommand: node --check cloudflare/proxy.mjs
    startCommand: node cloudflare/proxy.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: WORKER_ORIGIN
        value: https://link-workspace-check.links-9188.workers.dev
